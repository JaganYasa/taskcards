<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
       
        <div class="card">
            <div class="card-header">
                <img class="profile-img" src="jagan img.jpg" alt="Jagan">
                <i class="fab fa-facebook facebook-icon"></i>
                <i class="fab fa-twitter twitter-icon"></i>
                <i class="fab fa-github github-icon"></i>
            </div>
            <div class="card-body">
                <h3 class="card-title">Jagan</h3>
                <p class="card-description">Web Developer</p>
                <div class="stars">★★★★★</div>
                <a href="#" class="card-button">About Me</a>
                <a href="#" class="card-button">Hire Me</a>
            </div>
        </div>

         <div class="card">
            <div class="card-header">
                <img class="profile-img" src="uma mahesh img.jpg" alt="Mahesh">
                <i class="fab fa-facebook facebook-icon"></i>
                <i class="fab fa-twitter twitter-icon"></i>
                <i class="fab fa-github github-icon"></i>
            </div>
            <div class="card-body">
                <h3 class="card-title">Mahesh</h3>
                <p class="card-description">UI/UX Designer</p>
                <div class="stars">★★★★☆</div>
                <a href="#" class="card-button">About Me</a>
                <a href="#" class="card-button">Hire Me</a>
            </div>
        </div>

         <div class="card">
            <div class="card-header">
                <img class="profile-img" src="Dinesh img.jpg" alt="Dinesh">
                <i class="fab fa-facebook facebook-icon"></i>
                <i class="fab fa-twitter twitter-icon"></i>
                <i class="fab fa-github github-icon"></i>
            </div>
            <div class="card-body">
                <h3 class="card-title">Dinesh</h3>
                <p class="card-description">Java Developer</p>
                <div class="stars">★★★★☆</div>
                <a href="#" class="card-button">About Me</a>
                <a href="#" class="card-button">Hire Me</a>
            </div>
        </div>

        
        
    </div>
</body>
</html>
